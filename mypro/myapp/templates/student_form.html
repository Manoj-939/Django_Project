  <body>
    <h2>Add Student</h2>
    <form method="POST">
      {% csrf_token %} Name:
      <input type="text" name="name" id="" /><br /><br />
      Roll No:
      <input type="number" name="roll" id="" /><br /><br />
      Class:
      <input type="number" name="class" id="" /><br /><br />
      Age:

      <input type="text" name="contact" id="" /><br /><br />

    </form>
    <p>{{message}}</p>
    <a href="/modelsapp/list">View Students</a>
  </body>
